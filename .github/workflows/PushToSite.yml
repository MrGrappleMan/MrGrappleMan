name: Sync to GitHub Pages
on:
  push:
    branches: [ main ]
    paths: [ 'README.md' ] # Only triggers when README changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Push to Website Repo
        uses: nkoppel/push-files-to-another-repository@v1.1.0
        env:
          API_TOKEN_GITHUB: ${{ secrets.SYNC_TOKEN }} # Create a PAT for this
        with:
          source-files: 'README.md'
          destination-username: 'MrGrappleMan'
          destination-repository: 'MrGrappleMan.github.io'
          destination-directory: './content' # Or root
          commit-message: 'Sync: Updated from Profile README'